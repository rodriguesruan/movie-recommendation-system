name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Download MovieLens test data
        run: |
          mkdir -p data/raw
          curl --fail --location --silent --show-error \
            https://files.grouplens.org/datasets/movielens/ml-1m.zip \
            --output "$RUNNER_TEMP/ml-1m.zip"
          unzip -q "$RUNNER_TEMP/ml-1m.zip" -d data/raw

      - name: Run test suite
        run: python -m pytest -q